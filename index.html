<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><meta name="description" content="A live countdown to Kedarnath Yatra — Jai Baba Kedar"><title>Kedarnath Yatra Countdown 🔱</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#fff;background:#06101b}body{min-height:100vh;overflow:hidden}.bg{position:fixed;inset:0;background-position:center;background-size:cover;filter:brightness(.5);transform:scale(1.04);transition:background-image 1s ease}.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(2,9,18,.45),rgba(2,8,16,.78))}.wrap{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(900px,100%);text-align:center;padding:38px 22px 28px;border:1px solid rgba(255,255,255,.16);border-radius:28px;background:rgba(3,13,25,.48);backdrop-filter:blur(8px);box-shadow:0 20px 80px rgba(0,0,0,.35)}.om{font-size:38px;margin-bottom:2px}.eyebrow{font-size:13px;letter-spacing:3px;text-transform:uppercase;opacity:.78}.title{font-size:clamp(34px,7vw,70px);line-height:1.05;margin:10px 0 5px;font-weight:800;text-shadow:0 5px 25px #000}.sub{font-size:clamp(16px,3vw,22px);opacity:.9;margin:0 0 28px}.count{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:760px;margin:auto}.unit{padding:18px 8px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13)}.num{font-size:clamp(30px,7vw,58px);font-weight:800;line-height:1}.label{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.65;margin-top:8px}.message{margin:28px auto 10px;font-size:clamp(17px,3vw,24px);font-weight:600}.date{font-size:13px;opacity:.62}.footer{margin-top:22px;font-size:12px;opacity:.5}.done{font-size:clamp(30px,7vw,64px);font-weight:800}.hidden{display:none}@media(max-width:520px){.card{padding:30px 12px 22px;border-radius:22px}.count{gap:7px}.unit{padding:15px 4px}.label{letter-spacing:1px;font-size:9px}}
</style></head><body><div class="bg" id="bg"></div><div class="shade"></div><main class="wrap"><section class="card"><div class="om">ॐ</div><div class="eyebrow">Baba Kedar is calling</div><h1 class="title">Kedarnath Yatra 🔱</h1><p class="sub">Countdown to the journey of a lifetime</p><div id="count" class="count"><div class="unit"><div class="num" id="days">0</div><div class="label">Days</div></div><div class="unit"><div class="num" id="hours">00</div><div class="label">Hours</div></div><div class="unit"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div><div class="unit"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div></div><div id="done" class="done hidden">🚩 Jai Baba Kedar! 🚩</div><div class="message" id="message"></div><div class="date">9 September 2026 · 10:40 PM IST</div><div class="footer">Har din ek nayi tasveer, har din Baba Kedar ke aur kareeb. 🙏</div></section></main><script>
const target=new Date('2026-09-09T22:40:00+05:30').getTime();
const photos=[
'https://images.unsplash.com/photo-1605649487212-47bdab064df7?auto=format&fit=crop&w=2000&q=85',
'https://images.unsplash.com/photo-1544735716-392fe2489ffa?auto=format&fit=crop&w=2000&q=85',
'https://images.unsplash.com/photo-1626621341517-bbf3d9990a23?auto=format&fit=crop&w=2000&q=85',
'https://images.unsplash.com/photo-1581793745862-99fde7fa73d2?auto=format&fit=crop&w=2000&q=85',
'https://images.unsplash.com/photo-1598091383021-15ddea10925d?auto=format&fit=crop&w=2000&q=85'
];
const messages=['Har Har Mahadev 🔱 Baba Kedar bula rahe hain!','Bas thoda aur intezaar… pahadon ka safar paas aa raha hai. 🏔️','Jai Baba Kedar! Har kadam Kedarnath ki ore. 🚩','Dil mein Mahadev, aankhon mein Kedarnath. 🙏','Yeh sirf safar nahi, Baba Kedar ka bulawa hai. 🔱','Kedarnath ki hawaon mein milne wala sukoon ab door nahi. 🏔️','Har Har Mahadev! Ab countdown apne antim mod par hai. 🚩'];
function dayIndex(){const now=new Date();const start=new Date('2026-08-29T00:00:00+05:30');return Math.max(0,Math.floor((now-start)/86400000))%messages.length}
function setBg(){document.getElementById('bg').style.backgroundImage=`url("${photos[dayIndex()%photos.length]}")`;document.getElementById('message').textContent=messages[dayIndex()]}
function tick(){const diff=target-Date.now();if(diff<=0){document.getElementById('count').classList.add('hidden');document.getElementById('done').classList.remove('hidden');document.getElementById('message').textContent='Har Har Mahadev! 🙏';return}let s=Math.floor(diff/1000);const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;document.getElementById('days').textContent=d;document.getElementById('hours').textContent=String(h).padStart(2,'0');document.getElementById('minutes').textContent=String(m).padStart(2,'0');document.getElementById('seconds').textContent=String(s).padStart(2,'0')}
setBg();tick();setInterval(tick,1000);setInterval(setBg,3600000);
</script></body></html>
